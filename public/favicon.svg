    d="M32 25.5C21.5 25.5 15.5 34.5 11.5 43C7.2 52 12.5 64 22.5 64C26.5 64 29.2 61.8 32 61.8C34.8 61.8 37.5 64 41.5 64C51.5 64 56.8 52 52.5 43C48.5 34.5 42.5 25.5 32 25.5Z"
