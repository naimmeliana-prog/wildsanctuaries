  <ellipse cx="24" cy="11.5" rx="8.8" ry="11.5" transform="rotate(-7 24 11.5)" fill="url(#ws-grad)" />
  <ellipse cx="40" cy="11.5" rx="8.8" ry="11.5" transform="rotate(7 40 11.5)" fill="url(#ws-grad)" />
  <ellipse cx="54.5" cy="25" rx="9" ry="12.5" transform="rotate(22 54.5 25)" fill="url(#ws-grad)" />
  <!-- Almohadilla plantar principal de felino/oso hasta el borde inferior (y=64) con nervadura de hoja de conservación -->
